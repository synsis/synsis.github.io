<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lin Yao (Synsis) — Papers &amp; Preprints</title>
  <meta name="description" content="Chronological archive of papers, preprints, and technical drafts by Lin Yao (Synsis).">
  <style>
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --surface-subtle: #f3f2ee;
      --border: #e5e3dc;
      --border-strong: #d4d1c7;
      --text: #1c1917;
      --text-secondary: #57534e;
      --text-muted: #78716c;
      --accent: #1d4ed8;
      --accent-soft: #eff6ff;
      --accent-hover: #1e40af;
      --badge-bg: #f1f5f9;
      --badge-text: #334155;
      --timeline-line: #d6d3cb;
      --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.04);
      --shadow-md: 0 8px 24px rgba(28, 25, 23, 0.08);
      --radius: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="dark"] {
      --bg: #111110;
      --surface: #1a1918;
      --surface-subtle: #242321;
      --border: #2e2c29;
      --border-strong: #3f3c38;
      --text: #f5f5f4;
      --text-secondary: #c7c3bc;
      --text-muted: #938e86;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.14);
      --accent-hover: #93c5fd;
      --badge-bg: #262624;
      --badge-text: #d6d3d1;
      --timeline-line: #33312e;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* Header */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .profile-name {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .profile-handle {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .profile-affiliation {
      margin: 8px 0 12px;
      color: var(--text-secondary);
      font-size: 0.96rem;
    }

    .profile-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.9rem;
    }

    .profile-links a {
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .profile-links a:hover {
      color: var(--accent);
      text-decoration: none;
    }

    .theme-btn {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    .theme-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    /* Section Header & Controls */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-pill {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      background: var(--surface-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.88rem;
      width: 220px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus {
      border-color: var(--accent);
    }

    .sort-btn {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sort-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    /* Tag bar */
    .tag-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .tag-filter {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tag-filter:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }
    .tag-filter.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* Timeline */
    .year-group {
      margin-bottom: 36px;
    }

    .year-heading {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .year-heading::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .timeline {
      position: relative;
      padding-left: 26px;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: var(--timeline-line);
    }

    .paper-item {
      position: relative;
      margin-bottom: 22px;
    }
    .paper-item:last-child {
      margin-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -24px;
      top: 20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .paper-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .paper-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }

    .paper-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.8rem;
    }

    .date-badge {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--text);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .version-badge {
      font-family: var(--font-mono);
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .status-badge {
      color: var(--badge-text);
      background: var(--badge-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .paper-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
    }

    .paper-subtitle {
      margin: 4px 0 0;
      font-family: var(--font-serif);
      font-size: 1.02rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .paper-authors {
      margin: 10px 0 0;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .paper-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .paper-tag {
      font-size: 0.76rem;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 2px 9px;
      border-radius: 999px;
    }

    .abstract-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--surface-subtle);
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }
    .abstract-box.hidden {
      display: none;
    }

    .paper-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn:hover {
      border-color: var(--border-strong);
      background: var(--surface-subtle);
      text-decoration: none;
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #ffffff;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* PDF Viewer Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 15, 0.72);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-shell {
      width: min(1120px, 100%);
      height: min(90vh, 920px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
    }

    .modal-title-wrap {
      min-width: 0;
    }

    .modal-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-sub {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pdf-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #525659;
    }

    /* Footer */
    .site-footer {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .container {
        padding: 24px 16px 60px;
      }
      .site-header {
        flex-direction: column;
      }
      .search-input {
        width: 100%;
      }
      .controls {
        width: 100%;
      }
      .paper-card {
        padding: 16px;
      }
      .modal-backdrop {
        padding: 8px;
      }
      .modal-shell {
        height: 92vh;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div>
        <h1 class="profile-name">
          Lin Yao <span class="profile-handle">@synsis</span>
        </h1>
        <p class="profile-affiliation">
          School of Computer Science, Shanghai Jiao Tong University · Zhongguancun Academy
        </p>
        <div class="profile-links">
          <a href="mailto:lin.yao@sjtu.edu.cn">lin.yao@sjtu.edu.cn</a>
          <a href="https://github.com/synsis" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
      <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle color theme">
        Dark Mode
      </button>
    </header>

    <main>
      <div class="toolbar">
        <h2 class="section-title">
          PDF Archive · 按时间归档
          <span id="paperCount" class="count-pill">0</span>
        </h2>
        <div class="controls">
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="搜索标题、关键词、日期..."
            aria-label="Search papers"
          >
          <button id="sortToggle" class="sort-btn" type="button">
            ↓ 最新优先
          </button>
        </div>
      </div>

      <div id="tagBar" class="tag-bar"></div>
      <div id="timelineRoot"></div>
    </main>

    <footer class="site-footer">
      <span>© Lin Yao (Synsis) · Hosted on GitHub Pages</span>
      <span>Papers &amp; Technical Drafts Archive</span>
    </footer>
  </div>

  <!-- Inline PDF Preview Modal -->
  <div id="pdfModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-shell">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <h3 id="modalTitle" class="modal-title">PDF Preview</h3>
          <div id="modalSub" class="modal-sub"></div>
        </div>
        <div class="modal-actions">
          <a id="modalOpenTab" class="btn" href="#" target="_blank" rel="noopener">新标签打开</a>
          <a id="modalDownload" class="btn" href="#" download>下载 PDF</a>
          <button id="modalClose" class="btn" type="button">关闭 (Esc)</button>
        </div>
      </div>
      <iframe id="pdfFrame" class="pdf-frame" title="PDF Preview"></iframe>
    </div>
  </div>

  <script src="papers/manifest.js"></script>
  <script>
    (function () {
      const papers = Array.isArray(window.PAPERS) ? window.PAPERS.slice() : [];
      const state = {
        sortDesc: true,
        query: "",
        activeTag: "ALL"
      };

      const timelineRoot = document.getElementById("timelineRoot");
      const paperCount = document.getElementById("paperCount");
      const tagBar = document.getElementById("tagBar");
      const searchInput = document.getElementById("searchInput");
      const sortToggle = document.getElementById("sortToggle");
      const themeToggle = document.getElementById("themeToggle");

      // Modal elements
      const pdfModal = document.getElementById("pdfModal");
      const pdfFrame = document.getElementById("pdfFrame");
      const modalTitle = document.getElementById("modalTitle");
      const modalSub = document.getElementById("modalSub");
      const modalOpenTab = document.getElementById("modalOpenTab");
      const modalDownload = document.getElementById("modalDownload");
      const modalClose = document.getElementById("modalClose");

      // Theme handling
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeToggle.textContent = theme === "dark" ? "Light Mode" : "Dark Mode";
        try { localStorage.setItem("synsis-theme", theme); } catch (_) {}
      }

      const savedTheme = (() => {
        try { return localStorage.getItem("synsis-theme"); } catch (_) { return null; }
      })();
      if (savedTheme === "dark" || (!savedTheme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        applyTheme("dark");
      } else {
        applyTheme("light");
      }

      themeToggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        applyTheme(current === "dark" ? "light" : "dark");
      });

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderTags() {
        const tagSet = new Set();
        papers.forEach((p) => (p.tags || []).forEach((t) => tagSet.add(t)));
        const tags = ["ALL", ...Array.from(tagSet)];
        tagBar.innerHTML = tags
          .map((tag) => {
            const label = tag === "ALL" ? "全部" : tag;
            const active = state.activeTag === tag ? "active" : "";
            return `<button type="button" class="tag-filter ${active}" data-tag="${escapeHtml(tag)}">${escapeHtml(label)}</button>`;
          })
          .join("");
      }

      function getFilteredPapers() {
        const q = state.query.trim().toLowerCase();
        return papers
          .filter((p) => {
            if (state.activeTag !== "ALL" && !(p.tags || []).includes(state.activeTag)) {
              return false;
            }
            if (!q) return true;
            const haystack = [
              p.date,
              p.version,
              p.status,
              p.title,
              p.subtitle,
              p.authors,
              p.abstract,
              ...(p.tags || [])
            ]
              .join(" ")
              .toLowerCase();
            return haystack.includes(q);
          })
          .sort((a, b) => {
            const cmp = String(a.date).localeCompare(String(b.date));
            return state.sortDesc ? -cmp : cmp;
          });
      }

      function renderTimeline() {
        const list = getFilteredPapers();
        paperCount.textContent = `${list.length} 篇`;

        if (list.length === 0) {
          timelineRoot.innerHTML = `<div class="empty-state">没有匹配的 PDF 文档。</div>`;
          return;
        }

        // Group by year while preserving sorted order
        const groups = [];
        const groupMap = new Map();
        list.forEach((paper) => {
          const year = String(paper.date || "Other").slice(0, 4);
          if (!groupMap.has(year)) {
            const group = { year, items: [] };
            groupMap.set(year, group);
            groups.push(group);
          }
          groupMap.get(year).items.push(paper);
        });

        const expandAbstractByDefault = list.length <= 3;

        timelineRoot.innerHTML = groups
          .map((group) => {
            const cardsHtml = group.items
              .map((p) => {
                const tagsHtml = (p.tags || [])
                  .map((t) => `<span class="paper-tag">${escapeHtml(t)}</span>`)
                  .join("");

                const codeBtn = p.code
                  ? `<a class="btn" href="${escapeHtml(p.code)}" target="_blank" rel="noopener">Code</a>`
                  : "";

                const abstractToggle = p.abstract
                  ? `<button type="button" class="btn" data-toggle-abstract="${escapeHtml(p.id)}">${expandAbstractByDefault ? "收起摘要" : "查看摘要"}</button>`
                  : "";

                const abstractBlock = p.abstract
                  ? `<div id="abs-${escapeHtml(p.id)}" class="abstract-box ${expandAbstractByDefault ? "" : "hidden"}"><strong>Abstract.</strong> ${escapeHtml(p.abstract)}</div>`
                  : "";

                return `
                  <article class="paper-item" id="paper-${escapeHtml(p.id)}">
                    <span class="timeline-dot" aria-hidden="true"></span>
                    <div class="paper-card">
                      <div class="paper-meta">
                        <span class="date-badge">${escapeHtml(p.date)}</span>
                        ${p.version ? `<span class="version-badge">${escapeHtml(p.version)}</span>` : ""}
                        ${p.status ? `<span class="status-badge">${escapeHtml(p.status)}</span>` : ""}
                      </div>
                      <h3 class="paper-title">${escapeHtml(p.title)}</h3>
                      ${p.subtitle ? `<p class="paper-subtitle">${escapeHtml(p.subtitle)}</p>` : ""}
                      <p class="paper-authors">${escapeHtml(p.authors)}${p.affiliation ? ` · <span style="color:var(--text-muted)">${escapeHtml(p.affiliation)}</span>` : ""}</p>
                      ${tagsHtml ? `<div class="paper-tags">${tagsHtml}</div>` : ""}
                      ${abstractBlock}
                      <div class="paper-actions">
                        <button type="button" class="btn btn-primary" data-preview-id="${escapeHtml(p.id)}">在线预览 PDF</button>
                        <a class="btn" href="${escapeHtml(p.pdf)}" target="_blank" rel="noopener">新标签打开</a>
                        <a class="btn" href="${escapeHtml(p.pdf)}" download>下载 PDF</a>
                        ${codeBtn}
                        ${abstractToggle}
                      </div>
                    </div>
                  </article>
                `;
              })
              .join("");

            return `
              <section class="year-group">
                <h3 class="year-heading">${escapeHtml(group.year)}</h3>
                <div class="timeline">${cardsHtml}</div>
              </section>
            `;
          })
          .join("");
      }

      function openPreview(paperId, updateHash) {
        const paper = papers.find((p) => p.id === paperId);
        if (!paper) return;
        modalTitle.textContent = paper.title;
        modalSub.textContent = `${paper.date}${paper.version ? " · " + paper.version : ""}`;
        modalOpenTab.href = paper.pdf;
        modalDownload.href = paper.pdf;
        pdfFrame.src = paper.pdf + "#view=FitH";
        pdfModal.classList.add("open");
        document.body.style.overflow = "hidden";
        if (updateHash !== false) {
          history.replaceState(null, "", `#pdf=${encodeURIComponent(paper.id)}`);
        }
      }

      function closePreview() {
        pdfModal.classList.remove("open");
        pdfFrame.src = "about:blank";
        document.body.style.overflow = "";
        if (location.hash.startsWith("#pdf=")) {
          history.replaceState(null, "", location.pathname + location.search);
        }
      }

      // Event listeners
      tagBar.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-tag]");
        if (!btn) return;
        state.activeTag = btn.getAttribute("data-tag");
        renderTags();
        renderTimeline();
      });

      searchInput.addEventListener("input", (e) => {
        state.query = e.target.value;
        renderTimeline();
      });

      sortToggle.addEventListener("click", () => {
        state.sortDesc = !state.sortDesc;
        sortToggle.textContent = state.sortDesc ? "↓ 最新优先" : "↑ 最早优先";
        renderTimeline();
      });

      timelineRoot.addEventListener("click", (e) => {
        const previewBtn = e.target.closest("[data-preview-id]");
        if (previewBtn) {
          openPreview(previewBtn.getAttribute("data-preview-id"));
          return;
        }
        const absBtn = e.target.closest("[data-toggle-abstract]");
        if (absBtn) {
          const id = absBtn.getAttribute("data-toggle-abstract");
          const box = document.getElementById(`abs-${id}`);
          if (box) {
            const isHidden = box.classList.toggle("hidden");
            absBtn.textContent = isHidden ? "查看摘要" : "收起摘要";
          }
        }
      });

      modalClose.addEventListener("click", closePreview);
      pdfModal.addEventListener("click", (e) => {
        if (e.target === pdfModal) closePreview();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && pdfModal.classList.contains("open")) {
          closePreview();
        }
      });

      // Initial render
      renderTags();
      renderTimeline();

      // Open direct hash link if present (#pdf=<id>)
      if (location.hash.startsWith("#pdf=")) {
        const targetId = decodeURIComponent(location.hash.slice(5));
        openPreview(targetId, false);
      }
    })();
  </script>
</body>
</html>
